<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Slight hand-drawn wobble on outlines -->
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="envClip">
      <rect x="322" y="362" width="380" height="276" rx="30"/>
    </clipPath>
    <clipPath id="leftLeg">
      <rect x="322" y="362" width="78" height="276"/>
    </clipPath>
    <clipPath id="rightLeg">
      <rect x="624" y="362" width="78" height="276"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background; macOS applies the squircle mask -->
  <rect width="1024" height="1024" fill="#FDD35C"/>
  <!-- soft sunburst rays -->
  <g fill="#FFDF7E">
    <path d="M512 540 L285 0 L460 0 Z"/>
    <path d="M512 540 L615 0 L810 0 Z"/>
    <path d="M512 540 L1024 140 L1024 360 Z"/>
    <path d="M512 540 L1024 660 L1024 880 Z"/>
    <path d="M512 540 L0 250 L0 460 Z"/>
    <path d="M512 540 L0 730 L0 950 Z"/>
    <path d="M512 540 L380 1024 L600 1024 Z"/>
  </g>

  <g filter="url(#wobble)" stroke-linecap="round" stroke-linejoin="round">
    <!-- doodles: click lines + sparkles -->
    <g stroke="#2A2340" stroke-width="14" fill="none">
      <path d="M176 262 L136 254"/>
      <path d="M186 226 L154 198"/>
      <path d="M216 206 L208 168"/>
    </g>
    <path d="M846 160 Q852 196 884 202 Q852 208 846 244 Q840 208 808 202 Q840 196 846 160 Z"
          fill="#FFFFFF" stroke="#2A2340" stroke-width="10"/>
    <path d="M878 540 Q882 562 902 566 Q882 570 878 592 Q874 570 854 566 Q874 562 878 540 Z"
          fill="#FFFFFF" stroke="#2A2340" stroke-width="8"/>
    <circle cx="880" cy="290" r="10" fill="#2A2340"/>

    <!-- Keycap: offset shadow, skirt, face -->
    <rect x="218" y="262" width="624" height="596" rx="110" fill="#2A2340" opacity="0.22"/>
    <rect x="200" y="236" width="624" height="596" rx="110" fill="#E9DFCF" stroke="#2A2340" stroke-width="18"/>
    <!-- skirt shading -->
    <path d="M300 800 L360 800" stroke="#C9BBA4" stroke-width="14" fill="none"/>
    <path d="M700 800 L740 790 L770 760" stroke="#C9BBA4" stroke-width="14" fill="none"/>
    <rect x="240" y="256" width="544" height="490" rx="82" fill="#FFF9EE" stroke="#2A2340" stroke-width="14"/>
    <!-- face highlight -->
    <path d="M286 360 Q284 302 344 300 L410 300" stroke="#FFFFFF" stroke-width="16" fill="none"/>

    <!-- Envelope with M, tilted for some bounce -->
    <g transform="rotate(-6 512 500)">
      <rect x="334" y="378" width="380" height="276" rx="30" fill="#2A2340" opacity="0.18"/>
      <g clip-path="url(#envClip)">
        <rect x="322" y="362" width="380" height="276" fill="#FFFFFF"/>
        <rect x="322" y="362" width="78" height="276" fill="#4285F4"/>
        <rect x="624" y="362" width="78" height="276" fill="#34A853"/>
        <polyline points="361,384 512,500 663,384" fill="none" stroke="#EA4335" stroke-width="78" stroke-linejoin="round" stroke-linecap="square"/>
        <g clip-path="url(#leftLeg)">
          <polyline points="361,384 512,500 663,384" fill="none" stroke="#C5221F" stroke-width="78" stroke-linejoin="round" stroke-linecap="square"/>
        </g>
        <g clip-path="url(#rightLeg)">
          <polyline points="361,384 512,500 663,384" fill="none" stroke="#FBBC04" stroke-width="78" stroke-linejoin="round" stroke-linecap="square"/>
        </g>
      </g>
      <rect x="322" y="362" width="380" height="276" rx="30" fill="none" stroke="#2A2340" stroke-width="16"/>
    </g>
  </g>
</svg>
